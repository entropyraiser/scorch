[project]
name = "scorch"
dynamic = ["version"]
description = "Scripts, auxiliary tooling, and observability for the Scorch trading system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
scorch = "scorch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.hatch.version]
path = "src/scorch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scorch"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
