[http]
timeout_seconds = 60
retries = 3
retry_backoff_seconds = 2.0

[continuity]
# 4000 basis points is 40%. A larger move in a segment's row count fails the run.
max_relative_change_bp = 4000
# Names older manifests counted. A move in one of these is not a failure.
# None of these may also appear under exchanges.
retired_segments = [
  "Indices",
  "MCX",
  "NCO",
  "CDS",
  "BCD",
  "GLOBAL",
  "NSEIX",
]

# Display names with spaces removed, mapped to the derivative underlying.
# The index row, the underlying, and spot_key then share one key across brokers.
[index_aliases]
NIFTY50 = "NIFTY"
NIFTYBANK = "BANKNIFTY"
NIFTYFINSERVICE = "FINNIFTY"
NIFTYMIDSELECT = "MIDCPNIFTY"
NIFTYNEXT50 = "NIFTYNXT50"
NIFTYFPI150 = "NIFTYFPI"
SNSX50 = "SENSEX50"
BSEFOCUSEDIT = "FOCIT"

# role is cash or derivative.
# A derivative names the cash exchange that holds its spot, and may name a
# second cash exchange used only when the home exchange does not list the stock.
[exchanges.NSE]
role = "cash"

[exchanges.BSE]
role = "cash"

[exchanges.NFO]
role = "derivative"
spot = "NSE"
spot_fallback = "BSE"

[exchanges.BFO]
role = "derivative"
spot = "BSE"
spot_fallback = "NSE"

# omit_without_spot: underlyings this broker may drop when it publishes the
# derivative and not the spot. Any other missing spot fails that broker's run.
# A broker sets min_rows (one file, Kite) or segments (one file per entry,
# Firstock), not both. min_rows is a floor near half of a known-good snapshot.
# publish = false fetches the file for checks and leaves it out of instruments.csv.

[brokers.firstock]
omit_without_spot = ["FOCIT"]

[brokers.firstock.segments.NSE]
min_rows = 5000

[brokers.firstock.segments.BSE]
min_rows = 6000

[brokers.firstock.segments.NFO]
min_rows = 30000

[brokers.firstock.segments.BFO]
min_rows = 15000

[brokers.firstock.segments.Indices]
min_rows = 8000
publish = false

[brokers.kite]
min_rows = 50000
omit_without_spot = []
