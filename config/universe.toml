# Trading universe for the instrument download.
#
# This is the policy: which exchanges are written, where a derivative's spot
# lives, which brokers the morning job fetches, and the floors that reject a
# short or drifting file. A broker that does not publish an exchange simply
# has no rows for it. Listing an exchange here does not require every broker
# to have it.
#
# Vendor column layouts and instrument-type maps stay in the downloader.
# The instruments.csv columns and the key format stay in code; the trading
# process reads that file as a fixed layout.
#
# Broker order is the order the morning job downloads them.
# timezone and series are top-level keys, so they stay above the tables.

timezone = "Asia/Kolkata"

# Cash-symbol series suffixes. A hyphenated tail in this set is the series
# (RELIANCE-EQ). Any other tail stays in the symbol and the series is EQ,
# so BAJAJ-AUTO is not a series.
